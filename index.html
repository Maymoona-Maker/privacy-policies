<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policies</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: white;
      background: #172235;
      border: 1px solid #26354b;
      border-radius: 20px;
      padding: 24px;
      text-align: left;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #34d399;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .card h2 {
      margin-bottom: 7px;
      font-size: 21px;
    }

    .card p {
      color: #94a3b8;
      line-height: 1.5;
    }

    .footer {
      margin-top: 35px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Privacy Policies</h1>

    <p class="subtitle">
      Privacy information for our mobile applications.
    </p>

    <div class="cards">

      <a class="card" href="toolbox.html">
        <div class="icon">🧰</div>
        <h2>ToolBox</h2>
        <p>
          Privacy Policy for the ToolBox utility application.
        </p>
      </a>

      <a class="card" href="fitcalc.html">
        <div class="icon">💚</div>
        <h2>FitCalc</h2>
        <p>
          Privacy Policy for the FitCalc BMI and calorie calculator.
        </p>
      </a>

    </div>

    <div class="footer">
      © 2026 ToolBox & FitCalc
    </div>

  </div>

</body>
</html>
